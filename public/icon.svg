      <line x1="-78" y1="-40" x2="-44" y2="26"/>
      <line x1="-18" y1="-58" x2="16"  y2="22"/>
      <line x1="44"  y1="-52" x2="78"  y2="20"/>
    </g>
    <!-- base line -->
